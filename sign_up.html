    <title>Sign up</title>
    <script>
        function isLetter(char) {
            return /^[a-zA-Z]$/.test(char);
        }
        function isLowercase(char) {
            return /^[a-z]$/.test(char);
        }
        function isUppercase(char) {
            return /^[A-Z]$/.test(char);
        }
        function isDigit(char) {
            return /^[0-9]$/.test(char);
        }
        function isSpecialChar(char) {
            return /^[^a-zA-Z0-9]$/.test(char);
        }
        function containsDigitsAndLetters(text) {
            for (let i = 0; i < text.length; i++) {
                if (!(isLetter(text[i]) || isDigit(text[i]))) return false;
            }
            return true;
        }
        function isProperPassword(password) {
            let containsUpper = false, containsLower = false,
                containsDigit = false, containsSpecial = false;
            for (let i = 0; i < password.length; i++) {
                if (!containsUpper)   containsUpper   = isUppercase(password[i]);
                if (!containsLower)   containsLower   = isLowercase(password[i]);
                if (!containsDigit)   containsDigit   = isDigit(password[i]);
                if (!containsSpecial) containsSpecial = isSpecialChar(password[i]);
            }
            return containsUpper && containsLower && containsDigit && containsSpecial;
        }
        function checkForErrors(event) {
            event.preventDefault();
            const usernameError      = document.getElementById('username_error');
            const passwordError      = document.getElementById('password_error');
            const repeatPasswordError = document.getElementById('repeat_password_error');
            if (usernameError.innerHTML === "" &&
                passwordError.innerHTML === "" &&
                repeatPasswordError.innerHTML === "") {
                document.getElementById("signup_form").submit();
            }
        }
    </script>

<!-- Sign up card -->
<div id="signup-container">
    <h1>SIGN UP</h1>

    <form id="signup_form" method="post" action="create_user.php" autocomplete="off">

        <div id="signup-form">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
            <div class="field-error" id="username_error"></div>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
            <div class="field-error" id="password_error"></div>

            <label for="repeat_password">Repeat password</label>
            <input type="password" id="repeat_password" name="repeat_password" required>
            <div class="field-error" id="repeat_password_error"></div>

            <button type="button" id="signup-btn" onclick="checkForErrors(event)">SIGN UP</button>
        </div>

    </form>

    <div id="login-link">
        <p>Already have an account? <a href="login.php">Log in!</a></p>
    </div>
</div>

<script>
    const usernameInput        = document.getElementById('username');
    const passwordInput        = document.getElementById('password');
    const repeatPasswordInput  = document.getElementById('repeat_password');
    const usernameError        = document.getElementById('username_error');
    const passwordError        = document.getElementById('password_error');
    const repeatPasswordError  = document.getElementById('repeat_password_error');

    usernameInput.addEventListener('input', function() {
        const username = usernameInput.value;
        if ((username.length < 3 || username.length > 40) && username.length > 0) {
            usernameError.innerHTML = '<p>The username must be 3–40 characters long!</p>';
        } else if (!containsDigitsAndLetters(username) && username.length > 0) {
            usernameError.innerHTML = '<p>The username can only contain letters and numbers!</p>';
        } else {
            usernameError.innerHTML = "";
        }
    });

    passwordInput.addEventListener('input', function() {
        const password = passwordInput.value;
        if ((password.length < 8 || password.length > 64) && password.length > 0) {
            passwordError.innerHTML = '<p>The password must be 8–64 characters long!</p>';
        } else if (!isProperPassword(password) && password.length > 0) {
            passwordError.innerHTML = '<p>Must contain uppercase, lowercase, digit &amp; special character!</p>';
        } else {
            passwordError.innerHTML = "";
        }
    });

    repeatPasswordInput.addEventListener('input', function() {
        const password       = passwordInput.value;
        const repeatPassword = repeatPasswordInput.value;
        if (password !== repeatPassword && password !== "" && repeatPassword !== "") {
            repeatPasswordError.innerHTML = '<p>Passwords do not match!</p>';
        } else {
            repeatPasswordError.innerHTML = '';
        }
    });
</script>
